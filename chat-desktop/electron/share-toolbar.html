<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><link rel="stylesheet" href="share-toolbar.css"></head><body>
<header><span class="dot"></span><strong id="label">You are sharing</strong><span id="audio"></span><span id="tracking"></span></header>
<nav aria-label="Screen sharing controls"><button data-action="pointer" aria-label="Pointer" title="Pointer"><span aria-hidden="true">🖱️</span></button><button data-action="laser" aria-label="Laser" title="Laser"><span aria-hidden="true">🔴</span></button><button data-action="pen" aria-label="Pencil" title="Pencil"><span aria-hidden="true">✏️</span></button><button data-action="eraser" aria-label="Eraser" title="Eraser"><span aria-hidden="true">🧽</span></button><input id="color" type="color" aria-label="Annotation color" title="Annotation color" value="#facc15"><button data-action="undo" aria-label="Undo" title="Undo"><span aria-hidden="true">↶</span></button><button data-action="clear">Clear</button><button data-action="stop" class="stop" aria-label="Stop sharing" title="Stop sharing"><span aria-hidden="true">⏹️</span></button></nav><script src="share-toolbar.js"></script></body></html>
