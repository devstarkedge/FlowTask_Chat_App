# Deployment template for a TaskChat-controlled Linux VPS, not the web service.
services:
  turn:
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf", "--log-file=stdout"]
    volumes:
      - type: bind
        source: ${TURN_CONFIG_FILE:?Set TURN_CONFIG_FILE to the populated config on the VPS}
        target: /etc/coturn/turnserver.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
